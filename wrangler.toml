name = "dumont-frontdesk"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The rep app (web/), built by Vite. Served by this Worker rather than a separate Pages
# project so the app and the API share an origin: the session cookie is SameSite=Lax and a
# cross-site XHR would never send it, and resolveOrg() reads the tenant off the hostname.
# A hit here never runs the Worker, so the bundle costs no requests.
# not_found_handling stays "none": the SPA fallback lives in the Worker (see app.notFound),
# because "single-page-application" would answer /api/* with index.html instead.
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "none"

# Relational data — Postgres (Neon/Supabase) pooled through Hyperdrive
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "0f976080680e4b10b3ebddd9abbfc9ff"

# Artwork, voicemail audio, CSV imports
[[r2_buckets]]
binding = "FILES"
bucket_name = "frontdesk-files"

# Published chat flow + widget settings, read on every widget load (edge-cached)
[[kv_namespaces]]
binding = "CONFIG"
id = "d2e75694f3434c91ad641e913a0fd317"

# One object per live chat session / per org inbox for realtime fan-out
[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"
[[durable_objects.bindings]]
name = "INBOX_ROOM"
class_name = "InboxRoom"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession", "InboxRoom"]

# Self-binding: the chat DO calls back into the Worker for Postgres writes,
# since a Durable Object has no Hyperdrive binding of its own.
[[services]]
binding = "INTERNAL"
service = "dumont-frontdesk"

# Async work: transcription, spec extraction, enrichment, drip sends
[[queues.producers]]
binding = "JOBS"
queue = "frontdesk-jobs"
[[queues.consumers]]
queue = "frontdesk-jobs"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "frontdesk-dlq"

# Whisper for voicemail, LLM for spec extraction / intent
[ai]
binding = "AI"

# Drip scheduler + SLA checks
[triggers]
crons = ["*/5 * * * *"]

[vars]
PLATFORM_DOMAIN = "midlayr.app"          # <slug>.midlayr.app default per tenant; custom hostnames via Cloudflare for SaaS
WIDGET_ORIGIN = "https://cdn.midlayr.com"
# Workers AI retires models; swap this rather than editing src/jobs/extract-specs.ts
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# secrets (wrangler secret put): DATABASE_URL (local dev only; prod uses Hyperdrive),
#   TWILIO_AUTH_TOKEN, TWILIO_SID, SESSION_SECRET,
#   MAILGUN_API_KEY      — sending
#   MAILGUN_SIGNING_KEY  — verifies inbound Route webhooks. A DIFFERENT key from the API key;
#                          until it is set /hooks/mailgun rejects everything, which is the
#                          right way round: an unverified webhook can forge tickets.
# vars for Mailgun: MAILGUN_DOMAIN, and MAILGUN_BASE_URL for an EU account.
